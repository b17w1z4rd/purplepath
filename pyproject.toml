[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "purplepath"
version = "0.1.0"
description = "Offline contextual bandit for defensive red team exercise planning"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.scripts]
purplepath = "purplepath.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
