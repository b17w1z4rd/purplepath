name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m purplepath.cli generate --out /tmp/exercises.csv --episodes 500
      - run: python -m purplepath.cli train --data /tmp/exercises.csv --model /tmp/policy.json --report /tmp/evaluation.json
